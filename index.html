<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6fa860" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>小说拆文</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #nn-root { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
    .app-top {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      padding: env(safe-area-inset-top, 0) 12px 0; /* iOS 刘海 */
      padding-top: max(env(safe-area-inset-top, 0px), 10px);
      padding-bottom: 10px;
      background: var(--surface);
      border-bottom: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
      position: sticky; top: 0; z-index: 10;
    }
    .app-top h1 { margin: 0; font-size: 17px; font-weight: 700; flex: 1 1 auto; color: var(--text-strong); }
    .app-top .top-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border, #ccc);
      background: var(--surface-2, #fff);
      color: var(--text-strong);
      border-radius: 999px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; line-height: 1;
    }
    .app-top .top-btn:active { transform: scale(.95); }
    #feature { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    /* 让拆文内容区真正滚动 */
    #feature .nn { flex: 1 1 auto; min-height: 0; }
    #feature .nn-split { height: 100%; }
    .feature-inner { flex: 1 1 auto; height: 100%; min-height: 0; display: flex; flex-direction: column; }
    [data-theme="dark"] .app-top { border-bottom-color: rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="ic-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.4-4.5-1.4-6.5 0v13c2-1.4 4.5-1.4 6.5 0 2-1.4 4.5-1.4 6.5 0V6c-2-1.4-4.5-1.4-6.5 0Z"/><path d="M12 6v13"/></symbol>
    <symbol id="ic-note" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></symbol>
    <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M5 19V10M10 19V5M15 19v-7M20 19V9"/></symbol>
    <symbol id="ic-tag" viewBox="0 0 24 24"><path d="M3 12l8-8h7a2 2 0 0 1 2 2v7l-9 9z"/><circle cx="15" cy="8.5" r="1.3"/></symbol>
    <symbol id="ic-doc" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h4"/></symbol>
    <symbol id="ic-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3Z"/></symbol>
    <symbol id="ic-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19c4-4 7-7 11-9"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="ic-star" viewBox="0 0 24 24"><polygon points="12 3 14.9 8.6 21 9.3 16.5 13.5 17.8 20 12 16.8 6.2 20 7.5 13.5 3 9.3 9.1 8.6"/></symbol>
  </svg>
  <div id="nn-root">
    <header class="app-top">
      <h1>📝 小说拆文</h1>
      <button class="top-btn" id="btn-export" type="button">⬇ 导出</button>
      <button class="top-btn" id="btn-import" type="button">⬆ 导入</button>
      <button class="top-btn" id="btn-sync" type="button">☁ 同步</button>
      <button class="top-btn" id="theme-btn" type="button" aria-label="切换主题">🌙</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />

  <!-- 云同步面板：把个人热度趋势历史 + 收藏推到 GitHub 公开仓库 -->
  <div class="nn-sync-mask" id="nn-sync-mask">
    <div class="nn-sync" role="dialog" aria-modal="true" aria-label="云端同步">
      <h3>☁ 云端同步（个人趋势）</h3>
      <label for="nn-sync-token">GitHub Token（仅存本机，不写进代码）</label>
      <input id="nn-sync-token" type="password" autocomplete="off" placeholder="ghp_xxx 或 fine-grained token（需 repo 写权限）" />
      <label for="nn-sync-retain">保留时长</label>
      <select id="nn-sync-retain">
        <option value="30">近 30 天</option>
        <option value="180" selected>近半年（180 天）</option>
        <option value="365">近一年（365 天）</option>
      </select>
      <div class="nn-sync-btns">
        <button id="nn-sync-up" type="button">⬆ 上传云端</button>
        <button id="nn-sync-down" type="button">⬇ 下载云端</button>
      </div>
      <div class="nn-sync-status" id="nn-sync-status"></div>
      <div class="nn-sync-note">数据将写入公开仓库 <code>data/nn-user-history.json</code>（含你的收藏与趋势），任何人可见。建议用仅限本仓库、可过期的 token。</div>
      <button class="nn-sync-close" id="nn-sync-close" type="button">关闭</button>
    </div>
  </div>

    </header>
    <div id="feature"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
